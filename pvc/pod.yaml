apiVersion: v1
kind: Pod
metadata:
  name: task-pv-pd
spec:
  volumes:
    - name: task-pv-storage
      persistentVolumeClaim:
        claimName: task-pv-claim
  containers:
    - name: task-pv-container
      image: nginx
      ports:
        - containerPort: 80
      volumeMounts:
        - mountPath: '/usr/share/nginx/html'
          name: task-pv-storage
